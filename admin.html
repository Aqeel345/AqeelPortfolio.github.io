<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqeel Admin Panel</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:900px;margin:60px auto}.panel{padding:28px;border:1px solid #ffffff14;border-radius:22px;background:#0c1120}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#9ca6bd;font-size:13px;margin:15px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #ffffff14;border-radius:10px;background:#080c16;color:#fff}textarea{min-height:120px}.notice{padding:14px;border:1px solid #ffffff12;border-radius:12px;color:#aeb7ca}.btn{cursor:pointer;margin-top:18px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><main class="admin"><a class="brand" href="index.html"><span class="brand-dot"></span>AQ<span>EEL</span></a><section class="panel" style="margin-top:25px"><span class="kicker">PRIVATE ADMIN</span><h1>Portfolio Content Manager</h1><p class="notice">This static GitHub Pages version cannot securely store private credentials or database data. The controls below prepare your content; real persistent admin authentication requires a backend/database service.</p><div class="row"><div><label>Your name</label><input id="name" value="Aqeel Mehmood"></div><div><label>Professional title</label><input id="title" value="Web Developer | 2D Animator | Graphic Designer"></div></div><label>About / Home introduction</label><textarea id="about">Creative, professional, hardworking and fast-learning digital creator.</textarea><label>Email</label><input id="email" type="email" placeholder="your-real-email@example.com"><label>TikTok URL</label><input id="tiktok" placeholder="https://www.tiktok.com/@yourusername"><button class="btn primary" id="save">Save locally</button><a class="btn ghost" href="index.html">View Website ↗</a><p id="status" class="muted"></p></section></main><script>const fields=['name','title','about','email','tiktok'];fields.forEach(k=>{const v=localStorage.getItem('aqeel_'+k);if(v!==null)document.getElementById(k).value=v});document.getElementById('save').onclick=()=>{fields.forEach(k=>localStorage.setItem('aqeel_'+k,document.getElementById(k).value));document.getElementById('status').textContent='Saved on this browser.'};</script></body></html>
